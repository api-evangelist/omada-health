aid: omada-health
name: Omada Health
description: Omada Health is a virtual-first healthcare company founded in 2011 and headquartered in San
  Francisco that delivers integrated, evidence-based care programs for chronic disease management. Omada
  combines one-on-one health coaching, connected smart devices (cellular scales, blood pressure monitors,
  glucose meters), interactive lessons, and peer communities to support people managing prediabetes, type
  2 diabetes, hypertension, high cholesterol, and musculoskeletal (MSK) conditions, along with GLP-1 medication
  support and weight health. The company sells to employers, health plans, benefit consultants, and health
  systems rather than to individual consumers directly, and operates as a HIPAA covered entity and business
  associate. Omada Health is publicly traded and is a portfolio company of Andreessen Horowitz (a16z).
  It has no publicly documented developer API surface; this profile captures the company's public identity,
  security/compliance posture, and operational transparency pages.
